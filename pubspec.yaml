name: photo_sync
description: "Photo Sync - 把 Android 相册备份到 WebDAV、SMB、S3"
publish_to: "none"
version: 0.2.0+3

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  file_picker: 8.3.7
  # 固定到 2.2.x：2.3.x 起通过 jni 调用原生代码，会强制要求本地/CI 安装 NDK。
  path_provider_android: 2.2.20
  # file_picker 8.x 的 compileSdk 是 34，这里配平它的 lifecycle 依赖版本。
  flutter_plugin_android_lifecycle: 2.0.24
  connectivity_plus: ^7.3.2
  flutter_background_service: ^5.1.0
  smb_connect: ^0.0.9
  crypto: ^3.0.8
  intl: ^0.20.3
  uuid: ^4.6.0
  cupertino_icons: ^1.0.8
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
